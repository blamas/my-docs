[tools]
uv = "0.13.9"

[env]
UV_LOCKED = "1"

[tasks."build:resume"]
description = "Render one resume to _site"
usage = 'arg "<lang>" { choices "en" "fr" }'
run = """
uv run rendercv render resume/resume_${usage_lang}.yaml -nopng -typ ../_site/build/resume_${usage_lang}.typ \
  -pdf ../_site/resume_${usage_lang}.pdf -md ../_site/resume_${usage_lang}.md -html ../_site/resume_${usage_lang}.html
uv run scripts/to_jsonresume.py resume/resume_${usage_lang}.yaml _site/resume_${usage_lang}.json
"""

[tasks.build]
description = "Build the whole site into _site"
run = [
  "rm -rf _site && mkdir -p _site && cp -r site/. _site/",
  { task = "build:resume en" },
  { task = "build:resume fr" },
  "rm -rf _site/build",
  "for f in resume cv cv_en; do cp _site/resume_en.pdf _site/$f.pdf; done; cp _site/resume_fr.pdf _site/cv_fr.pdf",
  "for f in _site/resume_??.pdf; do n=$(grep -ao '/Type/Page[^s]' $f | wc -l); [ $n -eq 1 ] || { echo \"$f has $n pages\"; exit 1; }; done",
  "uv run --group dev check-jsonschema --schemafile https://raw.githubusercontent.com/jsonresume/resume-schema/v1.2.1/schema.json _site/resume_*.json",
]

[tasks.watch]
description = "Re-render a resume on save"
usage = 'arg "<lang>" { choices "en" "fr" }'
run = "uv run rendercv render resume/resume_${usage_lang}.yaml --watch -nopng -o ../_site/watch"
