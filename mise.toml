[tools]
uv = "0.11.33"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
run = "uv pip install -r requirements.txt"

[tasks."resume:en"]
depends = ["install"]
run = """
rendercv render resume/resume_en.yaml
python3 .github/scripts/to_jsonresume.py resume/resume_en.yaml public/resume_en.json
find resume/rendercv_output -maxdepth 1 -name '*.pdf'  -exec cp {} public/resume_en.pdf  \\;
find resume/rendercv_output -maxdepth 1 -name '*.md'   -exec cp {} public/resume_en.md   \\;
find resume/rendercv_output -maxdepth 1 -name '*.html' -exec cp {} public/resume_en.html \\;
"""

[tasks."resume:fr"]
depends = ["install"]
run = """
rendercv render resume/resume_fr.yaml
python3 .github/scripts/to_jsonresume.py resume/resume_fr.yaml public/resume_fr.json
find resume/rendercv_output -maxdepth 1 -name '*.pdf'  -exec cp {} public/resume_fr.pdf  \\;
find resume/rendercv_output -maxdepth 1 -name '*.md'   -exec cp {} public/resume_fr.md   \\;
find resume/rendercv_output -maxdepth 1 -name '*.html' -exec cp {} public/resume_fr.html \\;
"""

[tasks.resume]
run = """
mise run resume:en
mise run resume:fr
cp public/resume_en.pdf public/resume.pdf
"""
