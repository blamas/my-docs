---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Lint"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and lint toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
          install: true
          install_args: >-
            aqua:astral-sh/ruff
            aqua:casey/just
            aqua:evilmartians/lefthook
            aqua:gitleaks/gitleaks
            aqua:koalaman/shellcheck
            aqua:rhysd/actionlint
            aqua:zizmorcore/zizmor
            node
            npm:oxfmt

      - name: Run lint
        run: just lint
