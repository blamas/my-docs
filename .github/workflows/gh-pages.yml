name: RenderCV Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-rendercv-${{ hashFiles('**/gh-pages.yml') }}
          restore-keys: pip-rendercv-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render English resume
        run: |
          rendercv render resume/resume_en.yaml
          python3 .github/scripts/to_jsonresume.py resume/resume_en.yaml public/resume_en.json
          find resume/rendercv_output -maxdepth 1 -name '*.pdf'  -exec cp {} public/resume_en.pdf  \;
          find resume/rendercv_output -maxdepth 1 -name '*.md'   -exec cp {} public/resume_en.md   \;
          find resume/rendercv_output -maxdepth 1 -name '*.html' -exec cp {} public/resume_en.html \;

      - name: Render French resume
        run: |
          rendercv render resume/resume_fr.yaml
          python3 .github/scripts/to_jsonresume.py resume/resume_fr.yaml public/resume_fr.json
          find resume/rendercv_output -maxdepth 1 -name '*.pdf'  -exec cp {} public/resume_fr.pdf  \;
          find resume/rendercv_output -maxdepth 1 -name '*.md'   -exec cp {} public/resume_fr.md   \;
          find resume/rendercv_output -maxdepth 1 -name '*.html' -exec cp {} public/resume_fr.html \;

      - name: Finalise outputs
        run: |
          cp public/resume_en.pdf public/resume.pdf
          cp public/resume_en.pdf public/cv_en.pdf
          cp public/resume_fr.pdf public/cv_fr.pdf
          cp public/resume_en.pdf public/cv.pdf

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: ${{ secrets.CNAME }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: ${{ github.event.head_commit.message }}
